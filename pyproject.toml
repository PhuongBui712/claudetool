[project]
name = "claudetool"
version = "1.0.0"
description = "Claude Code Session Manager — list, preview, setup, and delete sessions."
readme = "README.md"
authors = [
    { name = "phuong712", email = "buitanphuong712@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
claudetool = "claudetool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claudetool*"]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
# COM812 conflicts with the formatter; the repo carries no copyright headers.
ignore = ["COM812", "CPY001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D103", "INP001"]

[tool.mypy]
strict = true
